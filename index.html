        <!-- relative path -> links to another page within the same website -->
        <a href="page2.html">

        </a>

        <a href="./lists.html">Lists</a>

    <div>
        <h1>Paragraphs</h1>
        <!-- div -> division -> groups elements together -->
        <p>hello, world!</p>
        <!-- p -> paragraph -> represents a block of text -->
        <!-- p has an open and close tag with text in between -->
        <br />
        <!-- br -> line break -> creates a break in the text -->
        <!-- br is a self-closing tag as it has NO TEXT CONTENT -->
        <p>paragraph 2</p>
        <p>paragraph 3</p>
        <p>paragraph 4</p>
        <p>paragraph 5</p>
    </div>
    <div>
        <h2>Images</h2>
        <a href="https://github.com/JHarry444/Ac0/tree/main">
            <!-- this image links to the GitHub repository as it's inside an <a> tag -->

        </a>

        <img
            src="https://static.wikia.nocookie.net/superheroes/images/4/4b/Batfink-web.jpg/revision/latest?cb=20140609122930" />
        <!-- img -> image -> displays an image -->
        <!-- also a self-closing tag as it has NO TEXT CONTENT -->
    </div>
    <div>
