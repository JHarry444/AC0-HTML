<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists</title>
</head>

<body>
    <h1>Lists</h1>

    <div>
        <h2>Ordered List</h2>
        <ol>
            <li>milk</li>
            <li>eggs</li>
            <li>cereal</li>
        </ol>
    </div>

    <div>
        <h2>Unordered List</h2>
        <ul>
            <li>milk</li>
            <li>eggs</li>
            <li>cereal</li>
        </ul>
    </div>
</body>

</html>
